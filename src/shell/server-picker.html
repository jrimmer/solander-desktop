<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solander</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #1a1a2e;
        color: #e0e0e0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .container {
        background: #16213e;
        border-radius: 12px;
        padding: 40px;
        width: 420px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      }
      h1 {
        font-size: 24px;
        margin-bottom: 8px;
        color: #fff;
      }
      p {
        font-size: 14px;
        color: #a0a0b0;
        margin-bottom: 24px;
        line-height: 1.5;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 6px;
        color: #c0c0d0;
      }
      input {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid #2a2a4e;
        border-radius: 8px;
        background: #0f3460;
        color: #e0e0e0;
        font-size: 15px;
        outline: none;
        transition: border-color 0.2s;
      }
      input:focus {
        border-color: #4a90d9;
      }
      input::placeholder {
        color: #5a5a7a;
      }
      .error {
        color: #e74c3c;
        font-size: 13px;
        margin-top: 6px;
        display: none;
      }
      .error.visible {
        display: block;
      }
      button {
        width: 100%;
        padding: 12px;
        margin-top: 20px;
        border: none;
        border-radius: 8px;
        background: #4a90d9;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      button:hover {
        background: #357abd;
      }
      button:disabled {
        background: #2a2a4e;
        color: #5a5a7a;
        cursor: not-allowed;
      }
      .spinner {
        display: none;
        width: 20px;
        height: 20px;
        border: 2px solid #4a90d9;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 12px auto;
      }
      .spinner.visible {
        display: block;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Welcome to Solander</h1>
      <p>Enter the URL of your Chatto server to get started.</p>
      <form id="server-form">
        <label for="server-url">Server URL</label>
        <input
          type="url"
          id="server-url"
          placeholder="https://chat.example.com"
          autocomplete="url"
          autofocus
        />
        <div id="error" class="error"></div>
        <div id="spinner" class="spinner"></div>
        <button type="submit" id="submit-btn">Connect</button>
      </form>
    </div>

    <script>
      // Use __TAURI_INTERNALS__ directly instead of ES module import
      // to avoid module resolution hangs in the Tauri webview.
      const form = document.getElementById("server-form");
      const input = document.getElementById("server-url");
      const errorEl = document.getElementById("error");
      const spinner = document.getElementById("spinner");
      const submitBtn = document.getElementById("submit-btn");

      function getInvoke() {
        return window.__TAURI_INTERNALS__?.invoke;
      }

      function setLoading(loading) {
        submitBtn.disabled = loading;
        spinner.classList.toggle("visible", loading);
        input.disabled = loading;
      }

      function showError(msg) {
        errorEl.textContent = msg;
        errorEl.classList.add("visible");
      }

      function hideError() {
        errorEl.textContent = "";
        errorEl.classList.remove("visible");
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        hideError();

        let url = input.value.trim();
        if (!url) {
          showError("Please enter a server URL.");
          return;
        }

        // Add https:// if no protocol specified
        if (!/^https?:\/\//i.test(url)) {
          url = "https://" + url;
          input.value = url;
        }

        // Step 1: URL syntax validation
        let parsed;
        try {
          parsed = new URL(url);
        } catch {
          showError("Invalid URL. Please enter a valid server address.");
          return;
        }

        if (parsed.protocol !== "https:" && parsed.protocol !== "http:") {
          showError("URL must start with http:// or https://");
          return;
        }

        setLoading(true);

        try {
          // Step 2: Reachability + Chatto probe
          // Use tauri-plugin-http to bypass CORS
          const probeUrl = new URL(
            "/api/connect/chatto.discovery.v1.ServerDiscoveryService/GetServer",
            url,
          ).toString();
          const response = await fetch(probeUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({}),
          });

          if (!response.ok) {
            showError(
              "Server is reachable but returned an unexpected response. Is this a Chatto server?",
            );
            return;
          }

          const data = await response.json();
          if (!data?.profile?.name) {
            showError("This does not appear to be a Chatto server.");
            return;
          }

          // Step 3: Persist the validated URL
          const invoke = getInvoke();
          if (typeof invoke !== "function") {
            showError("IPC not available. Are you running inside Tauri?");
            return;
          }
          await invoke("set_server_url", { url: url.replace(/\/+$/, "") });

          // Step 4: Reload to boot the SPA
          window.location.assign("/index.html");
        } catch (err) {
          console.error("Connection error:", err);
          showError("Could not reach the server. Check the URL and try again.");
        } finally {
          setLoading(false);
        }
      });
    </script>
  </body>
</html>
